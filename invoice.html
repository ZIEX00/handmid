<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANDMADE | الفاتورة</title>
    <style>
      @font-face { font-family: "Zain Rounded"; src: url("fonts/ZainRounded-VF.ttf") format("truetype"); font-style: normal; font-weight: 100 900; font-display: swap; }
      :root { --ink: #2e241d; --muted: #75685e; --paper: #f6f0e7; --line: #e4d8ca; --olive: #354035; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, sans-serif; font-size: 15px; }
      [dir="rtl"] body, [dir="rtl"] body * { font-family: "Zain Rounded", sans-serif !important; }
      [dir="rtl"] .invoice-head p,
      [dir="rtl"] .meta,
      [dir="rtl"] th,
      [dir="rtl"] td,
      [dir="rtl"] .delivery-note,
      [dir="rtl"] .lookup label,
      [dir="rtl"] .lookup-message,
      [dir="rtl"] button,
      [dir="rtl"] a { font-size: 14px; }
      [dir="rtl"] .customer { font-size: 15px; }
      .invoice { width: min(820px, calc(100% - 32px)); margin: 32px auto; padding: clamp(22px, 5vw, 42px); background: #fffdfb; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 48px #2e241d12; }
      .success-banner { margin-bottom: 28px; padding: 16px 18px; border: 1px solid #d5e0d1; border-radius: 12px; background: #f0f5ed; color: var(--olive); line-height: 1.7; }
      .success-banner strong { display: block; font-size: 18px; }
      .invoice-head { display: flex; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding-bottom: 22px; }
      .invoice-head h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .12em; }
      .invoice-head p, .meta { color: var(--muted); font-size: 12px; margin: 5px 0; }
      .invoice-title { text-align: left; }
      .invoice-title strong { display: block; font-size: 22px; }
      .invoice-title .meta { display: block; overflow-wrap: anywhere; }
      .customer { padding: 22px 0; display: grid; gap: 5px; font-size: 13px; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { padding: 12px 8px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; }
      th { color: var(--muted); font-size: 11px; }
      .total { display: flex; justify-content: space-between; margin-top: 22px; padding-top: 16px; border-top: 2px solid var(--ink); font-weight: 700; font-size: 16px; }
      .delivery-note { margin: 15px 0 0; padding: 12px 14px; border-radius: 10px; background: #f7f1e8; color: var(--muted); font-size: 12px; line-height: 1.7; }
      .invoice-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      button, a { border: 1px solid var(--ink); border-radius: 999px; padding: 10px 18px; background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; font: inherit; font-size: 12px; }
      a { background: transparent; color: var(--ink); }
      .lookup { width: min(430px, 100%); margin: 22px auto 0; display: grid; gap: 12px; }
      .lookup label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
      .lookup input { min-height: 42px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
      .lookup-message { min-height: 18px; margin: 0; color: #9b5145; font-size: 12px; }
      .empty { text-align: center; padding: 80px 10px; color: var(--muted); }
      @media (max-width: 560px) { .invoice-head { flex-direction: column; } .invoice-title { text-align: right; } th, td { padding: 10px 5px; font-size: 11px; } .invoice-actions > * { flex: 1 1 100%; text-align: center; } }
      @media print { body { background: #fff; } .invoice { width: 100%; margin: 0; border: 0; border-radius: 0; box-shadow: none; } .invoice-actions, .lookup { display: none !important; } }
    </style>
  </head>
  <body>
    <main class="invoice" id="invoice"></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
    <script src="invoice.js"></script>
  </body>
</html>
